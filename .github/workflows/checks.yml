name: Verify and optionally deploy
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the verified integration commit to existing Azure resources
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --prefix server
      - run: npm ci --prefix client
      - run: npm test --prefix server
      - run: python -B -m unittest discover -s server/test -p evaluation_test.py
      - run: node --test client/test/analysis.api.test.js client/test/diff-viewer.test.js
      - run: npm run build --prefix client
  container:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: docker build --label org.opencontainers.image.source=https://github.com/${{ github.repository }} -t "$IMAGE" .
      - run: docker run --detach --name prism-ci -p 127.0.0.1:5000:5000 -e DEMO_ONLY=true "$IMAGE"
      - name: Verify the built image without GitHub or Gemini requests
        run: |
          curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://127.0.0.1:5000/api/health
          curl --fail http://127.0.0.1:5000/api/demo/report | python -c 'import json,sys; r=json.load(sys.stdin); assert r["sample"]["readOnly"] is True'
          curl --fail http://127.0.0.1:5000/demo > /dev/null
          docker exec prism-ci node -e "if(require('node:fs').existsSync('/app/server/.env'))process.exit(1)"
      - uses: docker/login-action@v3
        if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/integration/v0-demo'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker push "$IMAGE"
        if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/integration/v0-demo'
      - name: Stop verification container
        if: always()
        run: docker rm --force prism-ci
  deploy:
    needs: container
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/integration/v0-demo'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      APP_NAME: ${{ vars.AZURE_APP_NAME }}
      WORKER_NAME: ${{ vars.AZURE_WORKER_JOB_NAME }}
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Update existing web app and worker to the same tested image
        run: |
          az containerapp update --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" --image "$IMAGE" --output none
          az containerapp job update --resource-group "$RESOURCE_GROUP" --name "$WORKER_NAME" --image "$IMAGE" --output none
