stages:
  - test
  - build

# Avoid running both a branch pipeline and an MR pipeline for the same push.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH'

default:
  image: node:22-bookworm-slim
  interruptible: true
  timeout: 10 minutes
  cache:
    key:
      files:
        - server/package-lock.json
        - client/package-lock.json
    paths:
      - .npm/

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  npm_config_prefer_offline: "true"
  FF_NETWORK_PER_BUILD: "true"

javascript_tests:
  stage: test
  script:
    - npm ci --prefix server
    - mkdir -p reports
    - node --test --test-concurrency=2 --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=reports/backend.xml server/test/*.test.js
    - node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=reports/frontend.xml client/test/*.test.js
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - reports/
    reports:
      junit:
        - reports/backend.xml
        - reports/frontend.xml

python_checks:
  stage: test
  image: python:3.12-slim-bookworm
  cache: []
  script:
    - python -B -m unittest discover -s server/test -p evaluation_test.py

queue_integration:
  stage: test
  services:
    - name: mongo:8.0
      alias: mongo
      variables:
        HEALTHCHECK_TCP_PORT: "27017"
    - name: mcr.microsoft.com/azure-storage/azurite:3.35.0
      alias: azurite
      command: ["azurite-queue", "--queueHost", "0.0.0.0", "--skipApiVersionCheck"]
      variables:
        HEALTHCHECK_TCP_PORT: "10001"
  variables:
    INTEGRATION_TESTS: "true"
    TEST_MONGODB_HOST: "mongo"
    # Public Azurite emulator credentials, NOT an Azure account or project secret.
    TEST_AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;QueueEndpoint=http://azurite:10001/devstoreaccount1;"
  script:
    - npm ci --prefix server
    - mkdir -p reports
    - node --test --test-name-pattern="durable queue integration" --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=reports/integration.xml server/test/webhook.test.js
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - reports/
    reports:
      junit: reports/integration.xml

frontend_build:
  stage: build
  script:
    - npm ci --prefix client
    - npm run build --prefix client
  artifacts:
    expire_in: 7 days
    paths:
      - client/dist/
